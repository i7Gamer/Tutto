<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutto</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Recovers from a stale service-worker cache serving an old HTML shell
      // that references JS chunks the current deploy no longer has (a failed
      // dynamic import, or a <script> tag itself 404ing/erroring). Runs before
      // main.tsx (and any React error boundary) even executes, so it can't
      // rely on any app code being loaded yet.
      //
      // Throttled to at most once per RELOAD_COOLDOWN_MS so a persistently
      // broken deploy triggers one reload attempt, not a refresh loop.
      var RELOAD_COOLDOWN_MS = 60000;
      // isExcluded guards against ever auto-reloading for an unrelated
      // third-party <script> error (analytics, a CDN widget, etc.) that
      // happens to load from '/assets/' or '/src/' in its own URL. The app
      // currently loads no such scripts — every external resource it uses
      // (Google Fonts) comes in via a CSS @import, which this listener never
      // sees — so this list is inert today; kept as a guard for if one is
      // ever added.
      var EXCLUDED_SCRIPT_SRC_SUBSTRINGS = ['socket.io', 'google', 'fonts.googleapis', 'cdn', 'analytics'];

      window.addEventListener('error', function(e) {
        var isChunkError = e.message && (e.message.includes('Failed to fetch dynamically imported module') || e.message.includes('Importing a module script failed'));
        var isAppScript = e.target && e.target.src && (e.target.src.includes('/assets/') || e.target.src.includes('/src/'));
        var isExcluded = e.target && e.target.src && EXCLUDED_SCRIPT_SRC_SUBSTRINGS.some(function(s) { return e.target.src.includes(s); });
        var isScriptError = e.target && e.target.tagName === 'SCRIPT' && isAppScript && !isExcluded;

        if (isChunkError || isScriptError) {
          // Offline is the one case where recovering is strictly worse than
          // doing nothing: the recovery below deletes every cache and
          // unregisters the worker, and with no network there is nothing to
          // refill them from — a missing chunk becomes an app that cannot
          // start at all until the device is back online. The throttle is no
          // help here, because one pass is all the damage there is. Returning
          // before the timestamp is written also leaves the single allowed
          // attempt intact for when the connection is back.
          if (navigator.onLine === false) {
            console.warn('[Auto-reload skipped] Offline — keeping the precache and the worker');
            return;
          }

          var lastReload = localStorage.getItem('tutto_last_reload');
          var now = Date.now();

          console.warn('[Auto-reload Check]', {
            message: e.message,
            src: e.target?.src,
            isChunkError: isChunkError,
            isScriptError: isScriptError,
            lastReload: lastReload ? new Date(parseInt(lastReload)).toISOString() : null,
            timeSinceLastReload: lastReload ? (now - parseInt(lastReload)) + 'ms' : 'never'
          });

          if (!lastReload || (now - parseInt(lastReload)) > RELOAD_COOLDOWN_MS) {
            console.error('[Auto-reloading] Triggering reload due to:', e.message || e.target?.src);
            localStorage.setItem('tutto_last_reload', now.toString());
            // Unregistering matters as much as deleting, and this was the one
            // recovery path that skipped it. src/sw.js only fills the precache
            // from its `install` event, and an unchanged worker never installs
            // again — so wiping the caches under a still-registered worker
            // destroys offline support until some later deploy happens to
            // change an asset. Unregistering makes the reload register a fresh
            // worker, which installs and precaches. Same pairing Home.tsx and
            // ErrorBoundary.tsx already use for their own recovery buttons.
            var unregisterThenReload = function() {
              if (!('serviceWorker' in navigator)) {
                window.location.reload();
                return;
              }
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                return Promise.all(registrations.map(function(r) { return r.unregister(); }));
              })['catch'](function() {})
                .then(function() { window.location.reload(); });
            };
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(name) { return caches.delete(name); }));
              })['catch'](function() {})
                .then(unregisterThenReload);
            } else {
              unregisterThenReload();
            }
          } else {
            console.log('[Auto-reload skipped] Too soon since last reload');
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

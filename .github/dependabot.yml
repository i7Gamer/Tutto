# Keeps dependencies and workflow pins from rotting across all package ecosystems in the repo.
#
# Ecosystems covered:
# - npm (root workspace / frontend)
# - npm (server workspace / backend)
# - docker (Dockerfile base images)
# - github-actions (.github/workflows actions)
#
# Grouped into single PRs per ecosystem to keep update volume manageable.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      server-dependencies:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-dependencies:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(docker)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(actions)'

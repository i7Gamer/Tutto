# Manual release publish: tags the image `latest` plus the version in
# package.json, so every release stays pullable at a pinned version after
# `latest` has moved on.
#
# Run it from the Actions tab. master is published regardless of which branch
# the run is dispatched from.

name: Publish latest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Read version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      sha: ${{ steps.read.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master
          # git describe --tags below needs the tag objects present locally;
          # actions/checkout does not fetch them by default even at full depth.
          fetch-tags: true

      - name: Read version from package.json
        id: read
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ -z "${version}" ] || [ "${version}" = "undefined" ]; then
            echo "::error::could not read a version from package.json"
            exit 1
          fi
          # Emitted alongside the version and passed to the publish workflow:
          # resolving master a second time down there could pick up a push that
          # landed in between, and tag it with the version read from here.
          sha="$(git rev-parse HEAD)"
          echo "Publishing version ${version} from ${sha}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # master routinely sits ahead of its last release tag with package.json
      # still reading the OLD version (e.g. 25+ commits past v1.5.4, version
      # still 1.5.4) — dispatching from there would silently republish that old
      # tag's version number under a brand new, unreviewed-as-a-release build.
      # README promises pinned versions stay pinned to what was actually
      # tagged, so this refuses to proceed unless HEAD is that exact tag.
      - name: Verify HEAD is the tagged release
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match HEAD 2>/dev/null)" = "v$(node -p "require('./package.json').version")" || { echo "::error::HEAD is not the release tag v$(node -p "require('./package.json').version") — publish-latest must be dispatched from the commit tagged as the release, not an arbitrary point on master"; exit 1; }

  publish:
    name: Publish
    needs: version
    uses: ./.github/workflows/docker-publish.yml
    with:
      tags: latest,${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.sha }}
    secrets: inherit

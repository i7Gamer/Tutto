name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  ci:
    name: Type Check, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The root postinstall runs "npm install" in server/, which may resolve
      # past the committed lockfile. Re-install from it so the build and the
      # server audit below reflect server/package-lock.json exactly.
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Run Unit & Integration Tests
        run: npm run test

      # Runs last so a newly published advisory cannot mask a real test failure.
      # Dependabot alerts alone missed several findings here (auto-triage
      # dismissals, and the server workspace), so audit both lockfiles directly.
      - name: Security Audit (root)
        run: npm audit --audit-level=high

      - name: Security Audit (server)
        run: npm audit --audit-level=high
        working-directory: server

  # Separate job so browser downloads and the serial three-browser run do not
  # delay feedback from the checks above. Both jobs start at the same time.
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # playwright.config.js starts the app itself via "npm start" and, because
      # CI is set, never reuses an existing server, runs single-worker with two
      # retries, and points the API server at an in-memory database (TEST_DB).
      - name: Run End-to-End Tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

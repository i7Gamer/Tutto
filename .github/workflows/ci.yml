name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Checkout is all either job needs the token for. Without this the workflow
# inherits the repository default, which for a public repository can be
# read/write across issues, packages and deployments — far more than a test run
# should be able to reach. Mirrors docker-publish.yml, which already sets it.
permissions:
  contents: read

# A superseded push (or a force-push-then-push) would otherwise run two
# instances of this workflow for the same branch side by side, each burning
# its own Actions minutes toward a result only the later one matters for.
# cancel-in-progress kills the older run the moment a newer one starts on the
# same ref. server/workflows.test.ts pins this.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Type Check, Lint & Test
    runs-on: ubuntu-latest
    # Today's run takes about 6 minutes; 25 leaves headroom for legitimate
    # variance while still bounding a hang. server/workflows.test.ts pins this.
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # cache-dependency-path because this repository has two lockfiles and both
      # jobs install from both. setup-node otherwise keys the cache on the one
      # lockfile beside the working directory, so a server-only bump restores a
      # cache keyed to a root lockfile that never changed — wrong, and invisible
      # in a green run. server/workflows.test.ts enforces this.
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # --ignore-scripts because the root postinstall is
      # `cd server && npm install`, and `npm install` REPAIRS a
      # package.json/lockfile disagreement by rewriting the lockfile on
      # the runner — destroying the very thing the server `npm ci` below
      # exists to catch, and leaving the server audit reading a rewritten
      # file. Dockerfile's builder stage already passes it. Pinned by
      # server/workflows.test.ts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The only thing that installs server/ now: the root install above runs
      # with --ignore-scripts, so its postinstall no longer resolves these
      # past the committed lockfile behind this step's back. `npm ci` here
      # therefore both installs them and fails the run if server/package.json
      # and server/package-lock.json disagree.
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Type Check
        run: npm run type-check

      # The test suites have their own project (tsconfig.test.json). Clean
      # since 2026-09-02; a new error here fails the build.
      - name: Type Check (test suites)
        run: npm run type-check:test

      - name: Lint
        run: npm run lint

      - name: Build Application
        run: npm run build

      # test:coverage rather than test: enforces the coverage floor configured
      # in vite.config.ts (COVERAGE_FLOOR_PERCENT), so a drop below it fails CI.
      - name: Run Unit & Integration Tests
        run: npm run test:coverage

      # The publish workflow's Hub-cleanup shell deletes manifests from a public
      # registry and otherwise only ever runs during a real publish — where it
      # is continue-on-error, so it broke three times without failing anything.
      # Runs the real steps, extracted from that workflow, against a stubbed API.
      - name: Test the publish workflow's cleanup steps
        run: npm run test:publish-cleanup

      # Runs last so a newly published advisory cannot mask a real test failure.
      # Dependabot alerts alone missed several findings here (auto-triage
      # dismissals, and the server workspace), so audit both lockfiles directly.
      # Through scripts/npm-audit-retry.mjs, not a bare npm audit: the wrapper
      # retries a registry outage (npm's own endpoint-error line) and nothing
      # else, so an advisory still fails on the first attempt. Pinned by
      # server/workflows.test.ts.
      - name: Security Audit (root)
        run: node scripts/npm-audit-retry.mjs

      - name: Security Audit (server)
        run: node ../scripts/npm-audit-retry.mjs
        working-directory: server

  # Separate job so browser downloads and the browser runs do not delay
  # feedback from the checks above. All jobs start at the same time.
  #
  # One matrix leg per browser project: the three engines used to run back to
  # back on one runner (~7 minutes of the job's 9), now each runs alone on its
  # own runner and downloads only its own browser. The matrix MUST list exactly
  # the projects in playwright.config.ts -- server/workflows.test.ts ties the
  # two together, because dropping an engine here would delete a third of the
  # e2e coverage with every check still green. fail-fast is off so one failing
  # engine never cancels the other two: a cancelled leg is a browser nobody
  # tested.
  e2e:
    name: End-to-End Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    # One engine's share of the former serial run plus its browser download;
    # 30 leaves headroom for legitimate variance while still bounding a hang.
    # server/workflows.test.ts pins this.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Same two-lockfile cache key as the ci job above.
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # --ignore-scripts because the root postinstall is
      # `cd server && npm install`, and `npm install` REPAIRS a
      # package.json/lockfile disagreement by rewriting the lockfile on
      # the runner — destroying the very thing the server `npm ci` below
      # exists to catch, and leaving the server audit reading a rewritten
      # file. Dockerfile's builder stage already passes it. Pinned by
      # server/workflows.test.ts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      # Only this leg's browser, with its OS libraries. The chromium leg takes
      # the headless shell alone: headless runs use it anyway, and the full
      # browser is another download nothing here opens.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.project }} ${{ matrix.project == 'chromium' && '--only-shell' || '' }}

      # playwright.config.ts starts the app itself with "npm run build && npm
      # run server" — the built artifact, rebuilt every run, not the dev
      # server — and, because CI is set, never reuses an existing server, runs
      # single-worker with two retries, and points the API server at an
      # in-memory database (TEST_DB).
      - name: Run End-to-End Tests
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - name: Upload Playwright report
        # always(), not failure(): a flaky-but-passed run is the only evidence
        # a flake leaves behind (the on-first-retry trace rides the report),
        # and failure() threw exactly that away on 2026-08-17 and 2026-08-21.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Per leg: upload-artifact refuses a second upload under a name
          # another leg already took.
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30

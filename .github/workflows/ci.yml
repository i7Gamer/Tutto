name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  ci:
    name: Type Check, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The root postinstall runs "npm install" in server/, which may resolve
      # past the committed lockfile. Re-install from it so the build and the
      # server audit below reflect server/package-lock.json exactly.
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Run Unit & Integration Tests
        run: npm run test

      # Runs last so a newly published advisory cannot mask a real test failure.
      # Dependabot alerts alone missed several findings here (auto-triage
      # dismissals, and the server workspace), so audit both lockfiles directly.
      - name: Security Audit (root)
        run: npm audit --audit-level=high

      - name: Security Audit (server)
        run: npm audit --audit-level=high
        working-directory: server

# Manual pre-release publish: refreshes the `nightly` tag from master without
# touching `latest`, for trying current master before it is released.
#
# Run it from the Actions tab. master is published regardless of which branch
# the run is dispatched from.

name: Publish nightly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    # security-events: write for the callee's Trivy SARIF upload — see the note
    # on docker-publish.yml's build job. Omitting it here is a parse error on
    # this file, not a lost scope.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tags: nightly
    secrets: inherit

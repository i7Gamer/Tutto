# Shared implementation behind the three manual publish workflows
# (publish-latest, publish-nightly, publish-tag). It is never dispatched
# directly — each caller supplies the tag list and inherits the Docker Hub
# secrets.
#
# Multi-arch is built on native runners rather than under QEMU emulation:
# i7Gamer/Tutto is a public repository, so the arm64 runners are free. Each
# runner pushes its own image by digest, and a final job assembles the tagged
# multi-arch manifest from those digests.

name: Publish Docker image

on:
  workflow_call:
    inputs:
      tags:
        description: 'Comma-separated Docker tags to publish, e.g. "latest,1.1.3"'
        required: true
        type: string
      ref:
        description: 'Commit, branch or tag to build. Defaults to master, whichever branch the run was dispatched from. Callers that read something out of the tree (publish-latest reads the version) pass the exact SHA they read it from.'
        required: false
        default: master
        type: string

# Publishes are serialised. Two overlapping runs would each see the other's
# pushed-but-not-yet-tagged digests as unreferenced, and the cleanup step would
# delete an image the other run is about to tag.
concurrency:
  group: publish-docker-image
  cancel-in-progress: false

env:
  IMAGE_NAME: i7gamer/tutto
  NODE_VERSION: '24'
  SMOKE_PORT: '3001'
  # Only ever reaches a throwaway container on the runner. The server refuses to
  # start in production without one, so the smoke test has to supply it.
  SMOKE_API_TOKEN: ci-smoke-token-not-a-secret
  # Well above the sub-second the ordered shutdown takes, and above
  # DEFAULT_SHUTDOWN_TIMEOUT_MS in server/shutdown.ts, so a container that hangs
  # is reported by the exit-code assertion rather than masked by Docker's SIGKILL.
  SMOKE_STOP_TIMEOUT: '20'
  # Docker Hub's management API. The OCI registry (registry-1.docker.io) is not
  # usable here: it answers manifest DELETE with 405 for Hub accounts.
  HUB_API: https://hub.docker.com/v2
  # Hub caps page_size at 100. MAX_TAG_PAGES only bounds the pagination loop —
  # reaching it means the keep-set would be incomplete, so cleanup skips itself
  # rather than delete against a partial list.
  HUB_API_PAGE_SIZE: '100'
  MAX_TAG_PAGES: '20'
  # Written before the tags move, read after they are verified. Carries the
  # digests this publish displaced between the two steps.
  SUPERSEDED_DIGESTS_FILE: /tmp/superseded-digests.txt

permissions:
  contents: read

jobs:
  # Never publish an image built from code that does not pass its own suite.
  verify:
    name: Type Check, Lint & Test
    runs-on: ubuntu-24.04
    # Everything downstream builds this exact commit. Each job checks out
    # independently, so resolving the ref per job would let a push landing
    # mid-run publish a tree that nothing here tested.
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve the commit under test
        id: resolve
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Verifying and publishing ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Mirrors ci.yml: the root postinstall may resolve past the committed
      # lockfile, so re-install the server workspace from its own.
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run Unit & Integration Tests
        run: npm run test

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Built into the local daemon first so the image can actually be run
      # before it is published. The push step below reuses this build from the
      # GHA cache — no second build. Both runners are native, so each arch is
      # smoke tested on its own hardware rather than only amd64.
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: tutto-smoke:${{ matrix.arch }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      # Catches the failure class that shipped repeatedly during development:
      # a runtime file or dependency missing from the image builds green and
      # only fails when the container starts. server/packaging.test.ts guards
      # it statically; this proves it on the real artifact.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -p "${SMOKE_PORT}:3001" \
            -e "API_TOKEN=${SMOKE_API_TOKEN}" \
            "tutto-smoke:${{ matrix.arch }}"

          # The container must come up on its own; no CORS_ORIGIN is supplied,
          # which is exactly how an unconfigured deployment starts.
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${SMOKE_PORT}/api/health" >/dev/null 2>&1; then
              echo "healthy after ${attempt} attempt(s)"
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "::error::container never became healthy"
              docker logs smoke
              exit 1
            fi
            sleep 2
          done

          echo "--- health ---"
          curl -fsS "http://127.0.0.1:${SMOKE_PORT}/api/health" | grep -q '"status":"ok"'

          echo "--- frontend, API 404, socket.io ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${SMOKE_PORT}/")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${SMOKE_PORT}/api/nope")" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${SMOKE_PORT}/socket.io/?EIO=4&transport=polling")" = "200"

          echo "--- a foreign origin must get no CORS header ---"
          # Captured with -f first: piping curl straight into grep made a
          # failed request indistinguishable from a clean response, so the
          # assertion passed whenever the endpoint was broken.
          foreign_headers="$(curl -fsS -D - -o /dev/null -H 'Origin: https://evil.example' \
            "http://127.0.0.1:${SMOKE_PORT}/api/stats/global")"
          if echo "${foreign_headers}" | grep -i '^access-control-allow-origin'; then
            echo "::error::image answered a foreign origin with an Access-Control-Allow-Origin header"
            exit 1
          fi

          echo "--- container logs ---"
          docker logs smoke

          echo "--- graceful shutdown ---"
          # `docker stop` SIGTERMs PID 1, which must be the server itself. The
          # handler in server/shutdown.ts closes the sockets, then the database,
          # then exits 0. An exit of 143 means SIGTERM's default disposition ran
          # instead — the entrypoint never handled it, or a launcher swallowed
          # it — and the database was torn down mid-flight. Asserted here because
          # nothing else exercises the signal path on a real image.
          started_at="$(date +%s%N)"
          docker stop -t "${SMOKE_STOP_TIMEOUT}" smoke >/dev/null
          echo "stopped in $(( ($(date +%s%N) - started_at) / 1000000 ))ms"

          docker logs smoke > /tmp/smoke-shutdown.log 2>&1
          for expected in 'Received SIGTERM, shutting down.' 'Closed socket and HTTP server.' 'Closed database.'; do
            if ! grep -qF "${expected}" /tmp/smoke-shutdown.log; then
              echo "::error::shutdown log is missing: ${expected}"
              cat /tmp/smoke-shutdown.log
              exit 1
            fi
          done

          stop_exit_code="$(docker inspect -f '{{.State.ExitCode}}' smoke)"
          if [ "${stop_exit_code}" != "0" ]; then
            echo "::error::container exited ${stop_exit_code} on docker stop — the ordered shutdown did not complete"
            cat /tmp/smoke-shutdown.log
            exit 1
          fi
          echo "exited cleanly (0)"

          docker rm -f smoke

      # Pushed without a tag: each architecture publishes only its digest, and
      # the merge job below is what creates the tagged multi-arch manifest.
      # Reads from the GHA cache written above — no second build.
      - name: Push image by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}

      # The digest is carried to the merge job as an empty file named after it.
      # The action's output is prefixed ("sha256:abc123…"), which cannot be a
      # filename — artifact upload rejects a colon — so only the bare hex is
      # stored and the merge job puts the "sha256:" back when rebuilding the
      # reference. The two halves have to agree, hence the format check.
      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          bare_digest="${DIGEST#sha256:}"
          case "${bare_digest}" in
            ''|*[!0-9a-f]*)
              echo "::error::unexpected digest format '${DIGEST}' — expected sha256:<hex>"
              exit 1
              ;;
          esac
          mkdir -p /tmp/digests
          touch "/tmp/digests/${bare_digest}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    # build already depends on verify; named here so the summary can report the
    # commit that was actually built.
    needs: [verify, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Has to run before `imagetools create` re-points the tags: afterwards the
      # digests they used to reference are unreachable through the API, and the
      # manifests they leave behind can no longer be identified at all. The
      # cleanup step below deletes exactly this set, minus whatever is still
      # referenced.
      #
      # Only what this run displaces is ever considered. Orphans left by earlier
      # publishes are invisible from here and need a one-off manual pass.
      - name: Record the digests these tags point at today
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REQUESTED_TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          : > "${SUPERSEDED_DIGESTS_FILE}"

          hub_namespace="${IMAGE_NAME%%/*}"
          hub_repo="${IMAGE_NAME##*/}"

          if ! jwt="$(curl -fsSL -X POST "${HUB_API}/users/login" \
                 -H 'Content-Type: application/json' \
                 -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
                 | jq -r '.token')"; then
            echo "::warning::could not authenticate to the Docker Hub API — this publish will leave its predecessor untagged"
            exit 0
          fi

          # The check above only catches a transport or non-2xx failure. Hub
          # answers a 2FA-enabled account with HTTP 200 and a login_2fa_token
          # instead of a token, so curl succeeds and jq prints the string
          # "null" — every later call would then send `Authorization: JWT null`,
          # 401, and be reported as "nothing to supersede" for good.
          if [ -z "${jwt}" ] || [ "${jwt}" = "null" ]; then
            echo "::warning::the Docker Hub API returned no token — this publish will leave its predecessor untagged"
            exit 0
          fi

          IFS=',' read -ra requested <<< "${REQUESTED_TAGS}"
          for tag in "${requested[@]}"; do
            trimmed="$(echo "${tag}" | xargs)"
            [ -z "${trimmed}" ] && continue

            # A tag published for the first time 404s here, which is not an
            # error — it supersedes nothing.
            response="$(curl -sSL -w $'\n%{http_code}' \
              "${HUB_API}/repositories/${hub_namespace}/${hub_repo}/tags/${trimmed}" \
              -H "Authorization: JWT ${jwt}")"
            status="${response##*$'\n'}"
            payload="${response%$'\n'*}"

            if [ "${status}" != "200" ]; then
              echo "  ${trimmed}: nothing to supersede (HTTP ${status})"
              continue
            fi

            # The manifest-list digest plus every arch and attestation
            # sub-manifest recorded against it.
            printf '%s' "${payload}" \
              | jq -r '(.digest // empty), (.images[]?.digest // empty)' \
              >> "${SUPERSEDED_DIGESTS_FILE}"
            echo "  ${trimmed}: recorded"
          done

          sort -u -o "${SUPERSEDED_DIGESTS_FILE}" "${SUPERSEDED_DIGESTS_FILE}"
          echo "--- superseded by this publish ---"
          sed 's/^/  /' "${SUPERSEDED_DIGESTS_FILE}"

      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        # Passed through the environment rather than interpolated into the
        # script body, so the input can never be parsed as shell.
        env:
          REQUESTED_TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail

          tag_args=()
          IFS=',' read -ra requested <<< "${REQUESTED_TAGS}"
          for tag in "${requested[@]}"; do
            trimmed="$(echo "${tag}" | xargs)"
            [ -z "${trimmed}" ] && continue
            tag_args+=(--tag "${IMAGE_NAME}:${trimmed}")
          done
          if [ ${#tag_args[@]} -eq 0 ]; then
            echo "::error::no tags resolved from input '${REQUESTED_TAGS}'"
            exit 1
          fi

          # One file per pushed digest, named after the bare hex by the build
          # jobs. nullglob so an empty directory yields no entries rather than
          # a literal '*', which would sail past the guard below and be sent to
          # the registry as a bogus reference.
          shopt -s nullglob
          digest_refs=()
          for digest_file in *; do
            digest_refs+=("${IMAGE_NAME}@sha256:${digest_file}")
          done
          if [ ${#digest_refs[@]} -eq 0 ]; then
            echo "::error::no digests were downloaded from the build jobs"
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${digest_refs[@]}"

      # Confirms the manifest really carries both architectures, rather than
      # one leg having silently failed and published a single-arch image.
      - name: Verify the published manifest
        env:
          REQUESTED_TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          first_tag="$(echo "${REQUESTED_TAGS}" | cut -d',' -f1 | xargs)"
          reference="${IMAGE_NAME}:${first_tag}"
          echo "Inspecting ${reference}"
          docker buildx imagetools inspect "${reference}"

          manifest="$(docker buildx imagetools inspect "${reference}" --raw)"
          for expected in linux/amd64 linux/arm64; do
            os="${expected%/*}"
            arch="${expected#*/}"
            if ! echo "${manifest}" | grep -q "\"architecture\": *\"${arch}\""; then
              echo "::error::${reference} is missing a ${expected} manifest entry"
              exit 1
            fi
            echo "  ${os}/${arch} present"
          done

      # Deletes what this publish displaced: the digests the tags pointed at
      # beforehand, minus everything any tag still references — an unchanged
      # rebuild republishes identical digests, and sub-manifests are shared
      # between tags. Runs after verification, so a publish that failed to
      # produce a good manifest never deletes the image it failed to replace.
      #
      # continue-on-error: a Hub API hiccup must never fail a good publish.
      # Every failure path below still reports itself as a warning rather than
      # dying silently.
      - name: Delete the manifests this publish superseded
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -s "${SUPERSEDED_DIGESTS_FILE}" ]; then
            echo "This publish superseded nothing — no cleanup needed"
            exit 0
          fi

          hub_namespace="${IMAGE_NAME%%/*}"
          hub_repo="${IMAGE_NAME##*/}"
          referenced_file=/tmp/referenced-digests.txt
          delete_body_file=/tmp/hub-delete-body.txt

          if ! jwt="$(curl -fsSL -X POST "${HUB_API}/users/login" \
                 -H 'Content-Type: application/json' \
                 -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
                 | jq -r '.token')"; then
            echo "::warning::could not authenticate to the Docker Hub API — skipping cleanup"
            exit 0
          fi

          # See the record step: a 200 login that carries no token would leave
          # jwt as the literal "null" and turn every delete into a silent 401.
          if [ -z "${jwt}" ] || [ "${jwt}" = "null" ]; then
            echo "::warning::the Docker Hub API returned no token — skipping cleanup"
            exit 0
          fi

          # Every digest any tag still points at. Paginated: a truncated list
          # would read as "unreferenced" and delete a live manifest.
          : > "${referenced_file}"
          next="${HUB_API}/repositories/${hub_namespace}/${hub_repo}/tags?page_size=${HUB_API_PAGE_SIZE}"
          pages=0
          while [ -n "${next}" ] && [ "${next}" != "null" ]; do
            pages=$((pages + 1))
            if [ "${pages}" -gt "${MAX_TAG_PAGES}" ]; then
              echo "::warning::more than ${MAX_TAG_PAGES} pages of tags — skipping cleanup rather than delete against a partial keep-set"
              exit 0
            fi
            if ! page="$(curl -fsSL "${next}" -H "Authorization: JWT ${jwt}")"; then
              echo "::warning::could not list tags — skipping cleanup"
              exit 0
            fi
            printf '%s' "${page}" \
              | jq -r '.results[] | (.digest // empty), (.images[]?.digest // empty)' \
              >> "${referenced_file}"
            next="$(printf '%s' "${page}" | jq -r '.next // empty')"
          done

          # A 200 that yields no digests at all means the listing is not telling
          # us what we think it is. Deleting against that would wipe live tags.
          if [ ! -s "${referenced_file}" ]; then
            echo "::warning::no referenced digests read back — skipping cleanup"
            exit 0
          fi

          deleted=0
          failed=0
          while IFS= read -r digest; do
            [ -z "${digest}" ] && continue
            # Line-exact: a substring match can mistake one digest for another.
            if grep -qxF "${digest}" "${referenced_file}"; then
              echo "  keeping ${digest} — a tag still points at it"
              continue
            fi
            status="$(curl -sS -o "${delete_body_file}" -w '%{http_code}' -X DELETE \
              "${HUB_API}/repositories/${hub_namespace}/${hub_repo}/manifests/${digest}" \
              -H "Authorization: JWT ${jwt}")"
            case "${status}" in
              2*)
                echo "  deleted ${digest} (HTTP ${status})"
                deleted=$((deleted + 1))
                ;;
              *)
                echo "::warning::could not delete ${digest} — HTTP ${status}: $(cat "${delete_body_file}")"
                failed=$((failed + 1))
                ;;
            esac
          done < "${SUPERSEDED_DIGESTS_FILE}"

          echo "Deleted ${deleted} superseded manifest(s), ${failed} failure(s)"

      - name: Summary
        env:
          REQUESTED_TAGS: ${{ inputs.tags }}
          PUBLISHED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          {
            echo "### Published \`${IMAGE_NAME}\`"
            echo
            echo "| Tag |"
            echo "| --- |"
            IFS=',' read -ra requested <<< "${REQUESTED_TAGS}"
            for tag in "${requested[@]}"; do
              trimmed="$(echo "${tag}" | xargs)"
              [ -n "${trimmed}" ] && echo "| \`${trimmed}\` |"
            done
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\` — built from \`${PUBLISHED_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
